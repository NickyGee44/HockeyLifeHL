<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1F3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FFF;stop-opacity:1" />
    </linearGradient>
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#darkBg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 0 L1920 0 L1920 1080 L0 1080 Z" fill="none" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#00F5FF" stroke-width="0.5"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#00F5FF" stroke-width="0.5"/>
  </g>

  <!-- Header - Premium Dark -->
  <rect width="1920" height="90" fill="#0F1228" opacity="0.95"/>
  <line x1="0" y1="90" x2="1920" y2="90" stroke="url(#accentGlow)" stroke-width="2"/>

  <text x="60" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">DARK MODE PRO</text>
  <rect x="50" y="30" width="4" height="40" fill="url(#accentGlow)"/>

  <!-- Navigation - Sleek -->
  <rect x="1500" y="30" width="100" height="35" rx="4" fill="#1A1F3A" stroke="#00F5FF" stroke-width="1"/>
  <text x="1550" y="53" font-family="Arial, sans-serif" font-size="14" fill="#00F5FF" text-anchor="middle">Teams</text>

  <rect x="1620" y="30" width="110" height="35" rx="4" fill="#1A1F3A" stroke="#7B2FFF" stroke-width="1"/>
  <text x="1675" y="53" font-family="Arial, sans-serif" font-size="14" fill="#7B2FFF" text-anchor="middle">Schedule</text>

  <rect x="1750" y="30" width="90" height="35" rx="4" fill="url(#accentGlow)"/>
  <text x="1795" y="53" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0E27" text-anchor="middle">Stats</text>

  <!-- Hero Section - Futuristic -->
  <g transform="translate(960, 300)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#7B2FFF" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#accentGlow)" stroke-width="2" filter="url(#darkGlow)"/>

    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="url(#accentGlow)" text-anchor="middle" filter="url(#darkGlow)">DARK MODE</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRO</text>
  </g>

  <text x="960" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#8B92A8" text-anchor="middle" letter-spacing="3">PREMIUM • SLEEK • SOPHISTICATED</text>

  <!-- Sample Cards - Premium Dark Style -->
  <g transform="translate(200, 540)">
    <rect width="440" height="300" rx="12" fill="#1A1F3A" stroke="url(#accentGlow)" stroke-width="1"/>
    <rect width="440" height="60" rx="12 12 0 0" fill="#0F1228"/>
    <line x1="20" y1="60" x2="420" y2="60" stroke="url(#accentGlow)" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">STANDINGS</text>

    <g transform="translate(30, 90)">
      <circle cx="20" cy="20" r="18" fill="url(#accentGlow)"/>
      <text x="20" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0E27" text-anchor="middle">1</text>
      <text x="60" y="28" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">Red Wings</text>
      <text x="350" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#00F5FF" text-anchor="end">12-3-1</text>
    </g>

    <g transform="translate(30, 150)">
      <circle cx="20" cy="20" r="18" fill="#2A2F4A"/>
      <text x="20" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8B92A8" text-anchor="middle">2</text>
      <text x="60" y="28" font-family="Arial, sans-serif" font-size="18" fill="#CCCCCC">Blue Jackets</text>
      <text x="350" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#7B2FFF" text-anchor="end">10-5-1</text>
    </g>
  </g>

  <g transform="translate(720, 540)">
    <rect width="480" height="300" rx="12" fill="#1A1F3A" stroke="#7B2FFF" stroke-width="1"/>
    <rect width="480" height="60" rx="12 12 0 0" fill="#0F1228"/>
    <line x1="20" y1="60" x2="460" y2="60" stroke="#7B2FFF" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">NEXT GAME</text>

    <rect x="40" y="100" width="400" height="80" rx="8" fill="#0F1228" stroke="url(#accentGlow)" stroke-width="1"/>
    <text x="240" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#8B92A8" text-anchor="middle">FRI • 7:30 PM</text>
    <text x="240" y="165" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="url(#accentGlow)" text-anchor="middle" filter="url(#darkGlow)">Red Wings vs Blue Jackets</text>

    <text x="240" y="220" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Arena 1 • Rink A</text>
  </g>

  <g transform="translate(1280, 540)">
    <rect width="440" height="300" rx="12" fill="#0F1228" stroke="url(#accentGlow)" stroke-width="2" filter="url(#darkGlow)"/>
    <text x="220" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">TOP SCORER</text>

    <circle cx="220" cy="160" r="65" fill="none" stroke="url(#accentGlow)" stroke-width="3" filter="url(#darkGlow)"/>
    <text x="220" y="180" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accentGlow)" text-anchor="middle">99</text>

    <text x="220" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="#8B92A8" text-anchor="middle">GOALS SCORED</text>
  </g>

  <!-- Footer Badge -->
  <rect x="780" y="990" width="360" height="50" rx="8" fill="#0F1228" stroke="url(#accentGlow)" stroke-width="1"/>
  <text x="960" y="1023" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="url(#accentGlow)" text-anchor="middle" letter-spacing="2">DARK MODE PRO TEMPLATE</text>
</svg>
