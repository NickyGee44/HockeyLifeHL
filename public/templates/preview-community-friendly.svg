<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm Background -->
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE8CC;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#warmBg)"/>

  <!-- Friendly Header -->
  <rect width="1920" height="100" fill="#FF9F40" opacity="0.9"/>
  <rect x="40" y="20" width="200" height="60" rx="30" fill="#FFFFFF" opacity="0.3"/>
  <text x="140" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5D4037" text-anchor="middle">🏒 Community League</text>

  <!-- Navigation - Rounded Friendly Buttons -->
  <g transform="translate(1450, 30)">
    <rect width="120" height="40" rx="20" fill="#FFFFFF"/>
    <text x="60" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF9F40" text-anchor="middle">Teams</text>
  </g>

  <g transform="translate(1590, 30)">
    <rect width="130" height="40" rx="20" fill="#FFFFFF"/>
    <text x="65" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF9F40" text-anchor="middle">Schedule</text>
  </g>

  <g transform="translate(1740, 30)">
    <rect width="100" height="40" rx="20" fill="#5D4037"/>
    <text x="50" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Stats</text>
  </g>

  <!-- Hero Section - Welcoming -->
  <g transform="translate(0, 100)">
    <rect width="1920" height="350" fill="#FFFFFF" opacity="0.6"/>

    <!-- Friendly Illustrations -->
    <circle cx="300" cy="175" r="60" fill="#FF9F40" opacity="0.3"/>
    <circle cx="1620" cy="175" r="80" fill="#8BC34A" opacity="0.2"/>
    <circle cx="960" cy="100" r="40" fill="#FF6B9D" opacity="0.25"/>

    <text x="960" y="200" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#5D4037" text-anchor="middle">Community Friendly</text>
    <text x="960" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#8D6E63" text-anchor="middle">Warm • Welcoming • Fun for Everyone</text>
    <text x="960" y="320" font-family="Arial, sans-serif" font-size="20" fill="#A1887F" text-anchor="middle">🤝 Building connections through sports 🎉</text>
  </g>

  <!-- Sample Cards - Friendly Design -->
  <g transform="translate(200, 540)">
    <rect width="440" height="320" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect width="440" height="80" rx="24 24 0 0" fill="#FF9F40"/>

    <!-- Friendly Icon -->
    <circle cx="70" cy="40" r="25" fill="#FFFFFF" opacity="0.3"/>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🏆</text>
    <text x="120" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Standings</text>

    <g transform="translate(40, 110)">
      <rect width="360" height="60" rx="12" fill="#FFF8E7"/>
      <circle cx="30" cy="30" r="20" fill="#FFD54F"/>
      <text x="30" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5D4037" text-anchor="middle">1</text>
      <text x="70" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#5D4037">Red Wings</text>
      <text x="320" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#8BC34A" text-anchor="end">12 Wins! 🎉</text>
    </g>

    <g transform="translate(40, 190)">
      <rect width="360" height="60" rx="12" fill="#F5F5F5"/>
      <circle cx="30" cy="30" r="20" fill="#FFE082"/>
      <text x="30" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5D4037" text-anchor="middle">2</text>
      <text x="70" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#5D4037">Blue Jackets</text>
      <text x="320" y="36" font-family="Arial, sans-serif" font-size="16" fill="#8D6E63" text-anchor="end">10 Wins</text>
    </g>
  </g>

  <g transform="translate(720, 540)">
    <rect width="480" height="320" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect width="480" height="80" rx="24 24 0 0" fill="#8BC34A"/>

    <circle cx="70" cy="40" r="25" fill="#FFFFFF" opacity="0.3"/>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📅</text>
    <text x="120" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Next Game</text>

    <rect x="50" y="110" width="380" height="140" rx="16" fill="#E8F5E9"/>
    <text x="240" y="150" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5D4037" text-anchor="middle">Friday at 7:30 PM</text>
    <text x="240" y="185" font-family="Arial, sans-serif" font-size="20" fill="#8D6E63" text-anchor="middle">Red Wings 🆚 Blue Jackets</text>
    <text x="240" y="220" font-family="Arial, sans-serif" font-size="16" fill="#A1887F" text-anchor="middle">Arena 1 • Everyone Welcome! 🎊</text>
  </g>

  <g transform="translate(1280, 540)">
    <rect width="440" height="320" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect width="440" height="80" rx="24 24 0 0" fill="#FF6B9D"/>

    <circle cx="70" cy="40" r="25" fill="#FFFFFF" opacity="0.3"/>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">⭐</text>
    <text x="120" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Star Player</text>

    <circle cx="220" cy="180" r="70" fill="#FFE082"/>
    <text x="220" y="200" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#5D4037" text-anchor="middle">99</text>

    <text x="220" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#8D6E63" text-anchor="middle">Amazing Season! 🌟</text>
  </g>

  <!-- Decorative Elements -->
  <circle cx="100" cy="950" r="30" fill="#FF9F40" opacity="0.2"/>
  <circle cx="1820" cy="950" r="40" fill="#8BC34A" opacity="0.2"/>
  <circle cx="960" cy="1000" r="25" fill="#FF6B9D" opacity="0.2"/>

  <!-- Footer Badge -->
  <rect x="730" y="990" width="460" height="60" rx="30" fill="#5D4037"/>
  <text x="960" y="1030" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">🏒 COMMUNITY FRIENDLY TEMPLATE 🤝</text>
</svg>
