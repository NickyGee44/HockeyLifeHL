<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F5F5F5"/>

  <!-- Header -->
  <rect width="1920" height="80" fill="#E31837"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">CLASSIC SPORTS LEAGUE</text>

  <!-- Navigation -->
  <rect x="1400" y="25" width="100" height="30" rx="4" fill="#000000"/>
  <text x="1425" y="47" font-family="Arial, sans-serif" font-size="14" fill="white">Teams</text>
  <rect x="1520" y="25" width="100" height="30" rx="4" fill="#000000"/>
  <text x="1538" y="47" font-family="Arial, sans-serif" font-size="14" fill="white">Schedule</text>
  <rect x="1640" y="25" width="100" height="30" rx="4" fill="#FFD700"/>
  <text x="1665" y="47" font-family="Arial, sans-serif" font-size="14" fill="#000000">Stats</text>

  <!-- Hero Section -->
  <rect y="80" width="1920" height="400" fill="#FFFFFF"/>
  <rect y="80" width="1920" height="400" fill="url(#classicGradient)"/>
  <defs>
    <linearGradient id="classicGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E31837;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <text x="960" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#E31837" text-anchor="middle">CLASSIC SPORTS</text>
  <text x="960" y="280" font-family="Arial, sans-serif" font-size="32" fill="#333333" text-anchor="middle">Traditional Professional Aesthetic</text>
  <text x="960" y="340" font-family="Arial, sans-serif" font-size="20" fill="#666666" text-anchor="middle">Bold colors • Sharp design • Timeless style</text>

  <!-- Sample Cards -->
  <g transform="translate(200, 540)">
    <rect width="450" height="280" rx="8" fill="white" stroke="#E6E6E6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="450" height="80" rx="8 8 0 0" fill="#E31837"/>
    <text x="225" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Team Stats</text>
    <circle cx="80" cy="160" r="40" fill="#FFD700"/>
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">1st</text>
    <text x="180" y="165" font-family="Arial, sans-serif" font-size="20" fill="#333333">Red Wings</text>
    <text x="180" y="195" font-family="Arial, sans-serif" font-size="16" fill="#666666">12-3-1 Record</text>
  </g>

  <g transform="translate(735, 540)">
    <rect width="450" height="280" rx="8" fill="white" stroke="#E6E6E6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="450" height="80" rx="8 8 0 0" fill="#000000"/>
    <text x="225" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Next Game</text>
    <text x="225" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#E31837" text-anchor="middle">FRI 7:30 PM</text>
    <text x="225" y="200" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle">Red Wings vs Blue Jackets</text>
    <text x="225" y="235" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Arena 1 • Rink A</text>
  </g>

  <g transform="translate(1270, 540)">
    <rect width="450" height="280" rx="8" fill="white" stroke="#E6E6E6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="450" height="80" rx="8 8 0 0" fill="#FFD700"/>
    <text x="225" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Top Scorer</text>
    <circle cx="225" cy="180" r="50" fill="#E31837"/>
    <text x="225" y="195" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">99</text>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Footer Badge -->
  <rect x="820" y="1000" width="280" height="50" rx="25" fill="#E31837"/>
  <text x="960" y="1033" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">CLASSIC SPORTS TEMPLATE</text>
</svg>
