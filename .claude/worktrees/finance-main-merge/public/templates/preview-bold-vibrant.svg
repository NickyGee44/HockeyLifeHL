<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Vibrant Background Gradient -->
  <defs>
    <linearGradient id="vibrantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF006E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FB5607;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBE0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8338EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A86FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB5607;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF006E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#vibrantBg)"/>

  <!-- Animated Header -->
  <rect width="1920" height="100" fill="#000000" opacity="0.3"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white" filter="url(#glow)">⚡ BOLD & VIBRANT</text>

  <!-- Navigation - Colorful Buttons -->
  <rect x="1500" y="30" width="120" height="40" rx="20" fill="#8338EC"/>
  <text x="1560" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">TEAMS</text>

  <rect x="1640" y="30" width="140" height="40" rx="20" fill="#FB5607"/>
  <text x="1710" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">SCHEDULE</text>

  <!-- Hero Section - High Energy -->
  <g transform="translate(960, 320)">
    <circle cx="0" cy="0" r="180" fill="#FFBE0B" opacity="0.6"/>
    <circle cx="0" cy="0" r="140" fill="#FF006E" opacity="0.7"/>
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">BOLD</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">VIBRANT</text>
  </g>

  <text x="960" y="420" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">🎨 HIGH ENERGY • COLORFUL • DYNAMIC</text>

  <!-- Sample Cards - Vibrant Colors -->
  <g transform="translate(180, 540)">
    <rect width="460" height="320" rx="24" fill="url(#cardGradient1)" filter="url(#glow)"/>
    <circle cx="230" cy="100" r="60" fill="white" opacity="0.9"/>
    <text x="230" y="115" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#8338EC" text-anchor="middle">1ST</text>
    <text x="230" y="200" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle">RED WINGS</text>
    <text x="230" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">12-3-1 • 25 PTS</text>
    <rect x="40" y="270" width="380" height="10" rx="5" fill="white" opacity="0.3"/>
    <rect x="40" y="270" width="300" height="10" rx="5" fill="#FFBE0B"/>
  </g>

  <g transform="translate(730, 540)">
    <rect width="460" height="320" rx="24" fill="url(#cardGradient2)" filter="url(#glow)"/>
    <text x="230" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">🔥 NEXT GAME 🔥</text>
    <rect x="50" y="110" width="360" height="120" rx="16" fill="white" opacity="0.2"/>
    <text x="230" y="160" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">FRI 7:30PM</text>
    <text x="230" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">RED WINGS VS</text>
    <text x="230" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">BLUE JACKETS</text>
  </g>

  <g transform="translate(1280, 540)">
    <rect width="460" height="320" rx="24" fill="#FFBE0B" filter="url(#glow)"/>
    <text x="230" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#000000" text-anchor="middle">⭐ TOP SCORER ⭐</text>
    <circle cx="230" cy="180" r="70" fill="#FF006E"/>
    <text x="230" y="200" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" text-anchor="middle">99</text>
    <text x="230" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle">WAYNE GRETZKY</text>
  </g>

  <!-- Footer Badge -->
  <rect x="760" y="980" width="400" height="60" rx="30" fill="#000000" opacity="0.8"/>
  <text x="960" y="1018" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">⚡ BOLD & VIBRANT TEMPLATE ⚡</text>
</svg>
