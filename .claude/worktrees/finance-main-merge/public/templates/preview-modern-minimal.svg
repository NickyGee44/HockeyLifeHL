<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Minimalist Header -->
  <line x1="0" y1="80" x2="1920" y2="80" stroke="#E8E8E8" stroke-width="1"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#1A1A1A">modern league</text>

  <!-- Navigation - Minimal -->
  <text x="1600" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#666666">Teams</text>
  <text x="1680" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#666666">Schedule</text>
  <text x="1780" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Stats</text>

  <!-- Hero Section - Clean Typography -->
  <rect y="80" width="1920" height="420" fill="#FAFAFA"/>

  <text x="960" y="280" font-family="Arial, sans-serif" font-size="96" font-weight="200" fill="#1A1A1A" text-anchor="middle">Modern Minimal</text>
  <line x1="760" y1="320" x2="1160" y2="320" stroke="#1A1A1A" stroke-width="2"/>
  <text x="960" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#666666" text-anchor="middle" letter-spacing="2">CLEAN · CONTEMPORARY · FOCUSED</text>

  <!-- Sample Cards - Minimal Design -->
  <g transform="translate(240, 580)">
    <rect width="400" height="300" rx="0" fill="white" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="#E8E8E8" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A" text-transform="uppercase" letter-spacing="1">Standings</text>

    <text x="30" y="110" font-family="Arial, sans-serif" font-size="16" fill="#666666">Red Wings</text>
    <text x="350" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="end">12-3-1</text>

    <text x="30" y="150" font-family="Arial, sans-serif" font-size="16" fill="#666666">Blue Jackets</text>
    <text x="350" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="end">10-5-1</text>

    <text x="30" y="190" font-family="Arial, sans-serif" font-size="16" fill="#666666">Avalanche</text>
    <text x="350" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="end">9-6-1</text>
  </g>

  <g transform="translate(720, 580)">
    <rect width="480" height="300" rx="0" fill="white" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="0" y1="60" x2="480" y2="60" stroke="#E8E8E8" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A" text-transform="uppercase" letter-spacing="1">Schedule</text>

    <rect x="30" y="90" width="420" height="60" fill="#FAFAFA"/>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#999999" text-transform="uppercase">Friday 7:30 PM</text>
    <text x="50" y="138" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A">Red Wings vs Blue Jackets</text>

    <rect x="30" y="170" width="420" height="60" fill="white"/>
    <text x="50" y="195" font-family="Arial, sans-serif" font-size="12" fill="#999999" text-transform="uppercase">Saturday 8:00 PM</text>
    <text x="50" y="218" font-family="Arial, sans-serif" font-size="16" fill="#1A1A1A">Avalanche vs Maple Leafs</text>
  </g>

  <g transform="translate(1280, 580)">
    <rect width="400" height="300" rx="0" fill="#1A1A1A"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="#333333" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-transform="uppercase" letter-spacing="1">Top Scorer</text>

    <text x="200" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="200" fill="white" text-anchor="middle">24</text>
    <text x="200" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#CCCCCC" text-anchor="middle">Goals</text>
  </g>

  <!-- Footer Badge -->
  <rect x="810" y="1000" width="300" height="50" rx="0" fill="#1A1A1A"/>
  <text x="960" y="1033" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="white" text-anchor="middle" letter-spacing="2">MODERN MINIMAL TEMPLATE</text>
</svg>
