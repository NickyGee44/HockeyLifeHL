<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hockey puck background circle -->
  <circle cx="256" cy="256" r="240" fill="#E31837"/>

  <!-- Hockey stick (simplified) -->
  <g transform="translate(256, 256)">
    <!-- Stick blade -->
    <rect x="-100" y="80" width="80" height="20" rx="10" fill="white" transform="rotate(-15 -60 90)"/>

    <!-- Stick shaft -->
    <rect x="-10" y="-120" width="20" height="180" rx="10" fill="white" transform="rotate(-15 0 0)"/>
  </g>

  <!-- Hockey puck -->
  <ellipse cx="340" cy="320" rx="45" ry="15" fill="white" opacity="0.9"/>
  <ellipse cx="340" cy="320" rx="40" ry="12" fill="#1a1a1a"/>

  <!-- Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    HOCKEY
  </text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="normal" fill="white" text-anchor="middle" opacity="0.9">
    STATS
  </text>
</svg>
