name: BeerLeagueHockey
options:
  minimumXcodeGenVersion: 2.39.0
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  BeerLeagueHockey:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeerLeagueHockey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.beerleaguehockey.native
        PRODUCT_NAME: Beer League Hockey
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Beer League Hockey
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
